name: MusicForAll
options:
  bundleIdPrefix: com.madebykraman
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 26.0
targets:
  MusicForAll:
    type: application
    platform: iOS
    sources:
      - path: MusicForAll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madebykraman.musicforall
        INFOPLIST_KEY_CFBundleDisplayName: Music For All
        INFOPLIST_KEY_NSAppleMusicUsageDescription: Music For All uses Apple Music access only when you connect Apple Music.
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
