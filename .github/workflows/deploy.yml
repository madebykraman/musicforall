name: Build Music For All
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build\n      - if: failure()\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          npm run build > build-output.txt 2>&1 || true\n          gh issue create --title "BUILD DIAGNOSTIC ${{ github.sha }}" --body "$(cat build-output.txt)"
